name: Vytte CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vytte-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-verification:
    name: PHP quality, tests, and official seed
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: >-
        {"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vytte_test
          POSTGRES_USER: vytte
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U vytte -d vytte_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore the Composer cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies once
        run: composer install --no-interaction --prefer-source --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Check PHP formatting
        run: vendor/bin/pint --test app bootstrap/app.php bootstrap/providers.php config database routes tests

      - name: Run one full sequential suite
        id: full-tests
        continue-on-error: true
        run: php artisan test --log-junit storage/logs/junit.xml

      - name: Build and validate the official database from scratch
        if: steps.full-tests.outcome == 'success'
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_DATABASE: vytte_test
          DB_USERNAME: vytte
          DB_PASSWORD: secret
        run: |
          php artisan migrate:fresh --seed --force
          php artisan methodology:validate

      - name: Report the first test error
        if: always() && steps.full-tests.outcome == 'failure'
        run: php .github/scripts/report-junit.php storage/logs/junit.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
